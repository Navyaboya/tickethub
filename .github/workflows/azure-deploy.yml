# CI: tests and builds on every push.
# Deploy to Azure runs only when started manually (Actions tab > Run workflow),
# after adding these repository secrets:
#   AZURE_WEBAPP_NAME
#   AZURE_WEBAPP_PUBLISH_PROFILE
name: Build, test and deploy to Azure

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Run tests and build
        run: mvn -B clean package
      - uses: actions/upload-artifact@v4
        with:
          name: app-jar
          path: target/tickethub.jar

  deploy:
    needs: build
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: app-jar
      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ secrets.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: tickethub.jar
