# CI/CD: runs tests on every push; deploys to Azure App Service from main.
# Setup: in your GitHub repo go to Settings > Secrets and variables > Actions and add
#   AZURE_WEBAPP_NAME      (your App Service name)
#   AZURE_WEBAPP_PUBLISH_PROFILE  (download "Publish profile" from the App Service overview page)
name: Build, test and deploy to Azure

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Run tests and build
        run: mvn -B clean package
      - uses: actions/upload-artifact@v4
        with:
          name: app-jar
          path: target/tickethub.jar

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: app-jar
      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ secrets.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: tickethub.jar
