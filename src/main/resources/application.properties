server.port=${PORT:8080}

# Database settings come from environment variables (no passwords in code)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/tickethub?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASS:pass}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
server.forward-headers-strategy=framework
