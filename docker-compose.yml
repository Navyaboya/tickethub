services:
  db:
    image: mysql:8
    environment:
      MYSQL_ROOT_PASSWORD: pass
      MYSQL_DATABASE: tickethub
    ports:
      - "3306:3306"

  app:
    build: .
    depends_on:
      - db
    environment:
      DB_URL: jdbc:mysql://db:3306/tickethub?useSSL=false&allowPublicKeyRetrieval=true
      DB_USER: root
      DB_PASS: pass
    ports:
      - "8080:8080"
    restart: on-failure
